{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="cover-letter-container">
  <h2>Cover Letter Builder</h2>
  <p>Create a professional cover letter that complements your resume.</p>

  <form class="cover-letter-form" method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}
          <small class="form-text text-muted">{{ field.help_text }}</small>
        {% endif %}
      </div>
    {% endfor %}
    <button type="submit" class="btn">Generate Cover Letter</button>
  </form>
</div>

<style>
.cover-letter-container {
  max-width: 800px;
  margin: 0 auto;
  color: #c9d1d9;
}
.cover-letter-form {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 1.5rem;
  margin-top: 2rem;
}
.form-group {
  margin-bottom: 1rem;
}
label {
  display: block;
  margin-bottom: 0.3rem;
  color: #c9d1d9;
  font-weight: 600;
}
input, textarea {
  width: 100%;
  background: #0d1117;
  border: 1px solid #30363d;
  border-radius: 6px;
  color: #c9d1d9;
  padding: 0.5rem;
  outline: none;
}
button.btn {
  background: #238636;
  color: #fff;
  border: none;
  padding: 0.7rem 1.2rem;
  border-radius: 6px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
}
button.btn:hover {
  background: #2ea043;
}
</style>
{% endblock %}
