<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space AstroResume</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="github-theme">
  <header>
    <nav class="main-nav">
      <div class="logo">
        <i class="fas fa-rocket"></i>
        <h1>Space AstroResume</h1>
      </div>
      <ul class="nav-links">
        <li><a href="{% url 'index' %}">Home</a></li>
        <li><a href="{% url 'templates' %}">Templates</a></li>
        <li><a href="{% url 'examples' %}">Examples</a></li>
        <li><a href="{% url 'cover_letter' %}">Cover Letter</a></li>
        <li><a href="{% url 'pricing' %}">Pricing</a></li>
        <li><a href="{% url 'resources' %}">Resources</a></li>
        <li><a href="{% url 'blog' %}">Blog</a></li>
        <li><a href="{% url 'testimonials' %}">Testimonials</a></li>
        <li><a href="{% url 'dashboard' %}">Dashboard</a></li>
        <li><a href="{% url 'faq' %}">FAQ</a></li>
        <li><a href="{% url 'contact' %}">Contact</a></li>
        <li><a href="{% url 'resume_form' %}">Create Resume</a></li>
      </ul>
    </nav>
  </header>

  <main>
    {% block content %}
    {% endblock %}
  </main>

  <!-- Simple Footer -->
  <footer class="site-footer">
    <div class="footer-content">
      <p>&copy; 2025 Space AstroResume. All rights reserved.</p>
    </div>
  </footer>

  <script src="{% static 'js/script.js' %}"></script>

  <!-- Inline styles for demonstration (move to styles.css if desired) -->
  <style>
    /* Make the header sticky */
    .main-nav {
      position: sticky;
      top: 0;
      z-index: 999;
      background-color: #161b22; /* Dark background for the nav */
      border-bottom: 1px solid #30363d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
    }

    .logo {
      display: flex;
      align-items: center;
    }

    .logo i {
      font-size: 1.5rem;
      color: #58a6ff;
      margin-right: 0.5rem;
    }

    .logo h1 {
      color: #c9d1d9;
      margin: 0;
      font-size: 1.2rem;
    }

    .nav-links {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      gap: 1rem;
    }

    .nav-links li a {
      color: #c9d1d9;
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .nav-links li a:hover {
      color: #58a6ff;
    }

    /* Footer */
    .site-footer {
      background-color: #161b22;
      border-top: 1px solid #30363d;
      padding: 10px;
      text-align: center;
      margin-top: 20px;
    }

    .site-footer p {
      color: #8b949e;
      margin: 0;
      font-size: 0.9rem;
    }
  </style>
</body>
</html>
